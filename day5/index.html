<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Directory & Filter</title>
    <script src="users.js" defer></script>
  </head>
  <body>
    <h1>User Directory</h1>

    <!-- 1. Load Button -->
    <button id="load-users">Load Users</button>

    <!-- 2. Labelled Filter Input -->
    <div>
      <label for="filter-input">Filter by name:</label>
      <input id="filter-input" type="text" placeholder="Search by name..." />
    </div>

    <!-- 3. Status Paragraph -->
    <p id="status"></p>

    <!-- 4. Empty Users List -->
    <ul id="users-list"></ul>
  </body>
</html>
